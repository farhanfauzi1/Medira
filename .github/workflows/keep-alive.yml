name: keep-supabase-alive
on:
  schedule:
    - cron: '0 3 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL=$(printf '%s' "$SB_URL" | tr -d '[:space:]')
          KEY=$(printf '%s' "$SB_KEY" | tr -d '[:space:]')
          curl -fsS "$URL/rest/v1/keep_alive?select=id&limit=1" -H "apikey: $KEY"
